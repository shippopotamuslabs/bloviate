[versions]
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.6"
# BLO-2: 2.60.1 is the minimum that processes Haze 2.0.1 — Haze ships
# Kotlin metadata 2.4.0 and Hilt 2.59.2's bundled metadata reader maxes
# out at 2.3.0 (`:app:hiltJavaCompileDebug` fails with haze on the
# classpath otherwise). This pin DIVERGES from Enclave's catalog —
# flag for Sean; Enclave's own bump is a separate follow-up.
hilt = "2.60.1"
coreKtx = "1.18.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
# ENC-90: the BOM still maps material3 to 1.4.0 (whose Expressive API is
# internal); 1.5.0-beta01 is the newest milestone that exposes
# MotionScheme / MaterialExpressiveTheme / MaterialShapes publicly, so
# material3 is pinned explicitly here and overrides the BOM for that one
# artifact. This pin deliberately DIVERGES from Enclave's catalog
# (BOM 2026.05.01 / material3 1.4.0) — flagged for Sean on ENC-90.
material3 = "1.5.0-beta01"
lifecycleRuntimeKtx = "2.10.0"
coroutinesVersion = "1.11.0"
datastorePreferences = "1.2.1"
hiltNavCompose = "1.3.0"
junitJupiterVersion = "6.1.0"
turbineVersion = "1.2.1"
robolectricVersion = "4.16.1"
apterJunit5Robolectric = "0.9.0"
javaxInject = "1"
ktlintVersion = "14.2.0"
detekt = "1.23.8"
firebaseBom = "34.19.0"
googleServices = "4.5.0"
firebaseCrashlytics = "3.0.8"
# Google Sign-In via Credential Manager (ENC-197): pins mirror Stratum's
# catalog exactly so the two apps stay aligned.
androidxCredentials = "1.7.0-alpha03"
googleid = "1.2.1"
# Custom-styles account cache (BLO-27 S2): JSON record encoding. No
# Enclave pin to mirror (no Enclave checkout alongside this repo);
# 1.11.0 is the newest stable proven in this environment's Gradle
# cache next to the Kotlin 2.3.21 serialization compiler plugin
# (Central's newest stable at the time is 1.12.0).
kotlinxSerialization = "1.11.0"
# Glass Bars Gospel (BLO-2; UI_DESIGN_SPEC.md §6.9): Haze 2.0.1 core
# blur. This pin is new — it does NOT exist in Enclave's catalog.
haze = "2.0.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutinesVersion" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltNavCompose" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junitJupiterVersion" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesVersion" }
turbine = { group = "app.cash.turbine", name = "turbine", version.ref = "turbineVersion" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutinesVersion" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
javax-inject = { group = "javax.inject", name = "javax.inject", version.ref = "javaxInject" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectricVersion" }
apter-junit5-robolectric-extension = { group = "tech.apter.junit5.jupiter", name = "robolectric-extension", version.ref = "apterJunit5Robolectric" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { group = "com.google.firebase", name = "firebase-auth" }
firebase-functions = { group = "com.google.firebase", name = "firebase-functions" }
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "androidxCredentials" }
androidx-credentials-play-services-auth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "androidxCredentials" }
googleid = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleid" }
haze = { group = "dev.chrisbanes.haze", name = "haze", version.ref = "haze" }
# The 2.x blur effect (hazeBlur + HazeBlurStyle) lives in a separate
# artifact the `haze` umbrella does NOT pull in (it only brings the
# core source/effect machinery).
haze-blur = { group = "dev.chrisbanes.haze", name = "haze-blur", version.ref = "haze" }
whisper-android = { group = "com.shippopotamuslabs", name = "whisper-android", version = "0.1.0-SNAPSHOT" }
whisper-android-hilt = { group = "com.shippopotamuslabs", name = "whisper-android-hilt", version = "0.1.0-SNAPSHOT" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintVersion" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
apter-robolectric-junit5 = { id = "tech.apter.junit5.jupiter.robolectric-extension-gradle-plugin", version.ref = "apterJunit5Robolectric" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
