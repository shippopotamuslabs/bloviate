# Bloviate CI — merge-request gates + merge-to-phone distribution.
#
# Mirrors Stratum's pipeline shape (home-server runner, .android-job template,
# distribute-internal lane) with Bloviate-specific adaptations:
#
# - google-services.json IS committed (app/google-services.json; Firebase SDK
#   integrated since ENC-151/ENC-197), so unlike Stratum there is no
#   GOOGLE_SERVICES_JSON variable and no config-copy step.
# - COMPOSITE BUILD: whisper-android is a git submodule consumed via
#   includeBuild. GIT_SUBMODULE_STRATEGY=recursive clones it plus its nested
#   whisper.cpp submodule. The whisper-android project's CI job-token
#   allowlist includes this project, which is what lets this project's job
#   token clone the submodule.
# - INCLUDED-BUILD SDK: the included whisper-android build resolves the SDK
#   location per build (see README / AGENTS.md §4), so before_script writes
#   sdk.dir local.properties at the root AND into third_party/whisper-android,
#   and installs the pinned NDK 28.2.13676358 the native build requires.
# - SIGNING: distribute-internal ships the RELEASE-signed APK. Release
#   signing material comes from CI/CD variables (see ONE-TIME SETUP below);
#   the assemble-release job reconstructs the gitignored keystore.properties
#   + .jks exactly like a local release build. The distribute path fails
#   loudly (exit 1) when signing material is missing — a debug/unsigned
#   build is never uploaded.
#
# ONE-TIME SETUP (Firebase part done 2026-10-18, ENC-63 — recorded for posterity):
# - Firebase project `bloviate-app` (#74044613867); Android app
#   1:74044613867:android:37d80fbdff97cd7b0d8aae for
#   com.shippopotamus.bloviate; App Distribution group "Internal" with Sean
#   as tester.
# - FIREBASE_SERVICE_ACCOUNT_JSON (type: File, protected) on this project:
#   the app-distribution-uploader@stratum-a1a5b service-account key (same
#   account Stratum's CI uses), granted roles/firebaseappdistro.admin on the
#   bloviate-app project.
# - Release signing (GitLab project -> Settings -> CI/CD -> Variables):
#   - KEYSTORE_BASE64 (type: File, protected): base64 of the release
#     keystore, never committed:
#       base64 -w0 .keystore/bloviate_keystore.jks
#   - STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD (masked, protected):
#     keystore.properties values (see keystore.properties.example).
#     These reconstruct the gitignored keystore.properties; the resulting
#     .keystore-signed-flag artifact proves the APK was signed.
# - whisper-android GitLab project: this project added to its CI/CD job
#   token allowlist.

workflow:
  rules:
    # Cost control (mirrors Stratum STR-110): MR pipelines run only when the
    # MR targets the default branch.
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event' && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == 'schedule'

default:
  interruptible: true

variables:
  # Gradle home lives INSIDE the project dir so the `cache:` stanza on
  # .android-job can capture it (same reasoning as Stratum).
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.ci-gradle-home"
  ANDROID_USER_HOME: "$CI_PROJECT_DIR/../ci-home/android-home"
  GRADLE_OPTS: "-Dorg.gradle.caching=true"
  # Recursive: bloviate -> whisper-android -> whisper.cpp; all three levels
  # are required for the composite build's native compile.
  GIT_SUBMODULE_STRATEGY: recursive

stages:
  - lint
  - test
  - deploy

# Shared setup for every Android job. Runs on the home-server (Katana) shell
# runner (same as Stratum since its Oct 2026 cost control): `image:` is
# ignored by the shell executor — the host toolchain is used.
.android-job:
  image:
    name: ghcr.io/cirruslabs/android-sdk:36
    pull_policy: if-not-present
  tags: [home-server]
  retry:
    max: 2
    when:
      - runner_system_failure
  cache:
    key:
      files:
        - gradle/libs.versions.toml
      prefix: gradle-deps
    paths:
      - .ci-gradle-home/caches/modules-2/
      - .ci-gradle-home/wrapper/
  before_script:
    - chmod +x gradlew
    # Self-heal a corrupt `android` CLI bundle (2026-10-22: the deprecated
    # sdkmanager shim bootstraps the new CLI into $ANDROID_USER_HOME/cli and
    # a partial download left a JVM-less skeleton behind, failing every job
    # with a missing libjvm.so). Only bundles without a JVM are removed;
    # the CLI re-downloads a fresh one on next use.
    - |
      for bundle in "$CI_PROJECT_DIR/../ci-home/android-home/cli/bundles/"*/; do
        if [ -d "$bundle" ] && [ ! -f "$bundle/jre/lib/server/libjvm.so" ]; then
          echo "Removing corrupt android CLI bundle: $bundle"
          rm -rf "$bundle"
        fi
      done
    # Shell executor runs non-login shells that may not carry ANDROID_HOME/PATH;
    # fall back to the home-server SDK location so sdkmanager/adb resolve.
    - export ANDROID_HOME="${ANDROID_HOME:-$HOME/Android/Sdk}"
    - export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
    - command -v sdkmanager || (echo "sdkmanager not found under $ANDROID_HOME" && exit 1)
    # `yes` dies with SIGPIPE (141) once sdkmanager exits; tolerate only that.
    - yes | sdkmanager --licenses > /dev/null || [ $? -eq 141 ]
    # App + whisper-android both compile against SDK 37, a preview-channel
    # platform published only as android-37.0 (idempotent).
    - yes | sdkmanager --channel=3 "platforms;android-37.0" > /dev/null || [ $? -eq 141 ]
    # whisper-android pins NDK 28.2.13676358 for its CMake build (idempotent).
    - yes | sdkmanager "ndk;28.2.13676358" > /dev/null || [ $? -eq 141 ]
    # The composite build resolves the SDK location per build: the included
    # whisper-android build does not see this repo's local.properties, so
    # write sdk.dir into both (the README documents the same step for IDEs).
    - printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
    - printf 'sdk.dir=%s\n' "$ANDROID_HOME" > third_party/whisper-android/local.properties
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Shared keystore bootstrap (mirrors Stratum's .keystore-setup): reconstructs
# the gitignored keystore.properties + .jks from CI/CD variables, so
# app/build.gradle.kts signs exactly like a local release build.
# KEYSTORE_BASE64 is a File variable: a path to a file holding base64 text.
.keystore-setup: &keystore-setup
  - |
    if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
      mkdir -p .keystore
      base64 -d "$KEYSTORE_BASE64" > .keystore/bloviate_keystore.jks
      printf 'storeFile=.keystore/bloviate_keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
        "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
      echo "SIGNED=true" > .keystore-signed-flag
      echo "Keystore configured — building signed APK"
    else
      echo "Keystore secrets not available — building unsigned APK"
      rm -f .keystore-signed-flag
    fi

# Fails if secrets are missing — for jobs that MUST be signed.
# Referenced via `!reference [.keystore-bootstrap, script]`.
.keystore-bootstrap:
  script:
    - *keystore-setup
    - test -f .keystore-signed-flag || (echo "Missing keystore secrets (KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD) — see header of .gitlab-ci.yml" && exit 1)

# Optional keystore bootstrap: signs if secrets are available, builds unsigned
# otherwise. For jobs like assemble-release that run on MRs without secrets.
.keystore-bootstrap-optional:
  script:
    - *keystore-setup

# Static analysis in one job (mirrors Stratum STR-76): detekt (hard gate,
# maxIssues: 0) and Android lint share one compile.
static-analysis:
  extends: .android-job
  stage: lint
  # needs: [] opts out of stage gating so the job starts immediately.
  needs: []
  script:
    - ./gradlew detekt lintDebug --continue
  artifacts:
    when: always
    paths:
      - '**/build/reports/detekt/'
      - '**/build/reports/lint-results-debug.html'
    expire_in: 1 week

unit-tests:
  extends: .android-job
  stage: test
  needs: []
  script:
    - ./gradlew testDebugUnitTest
  artifacts:
    when: always
    paths:
      - '**/build/reports/tests/'
    reports:
      junit: '**/build/test-results/**/TEST-*.xml'
    expire_in: 2 weeks

assemble-debug:
  extends: .android-job
  stage: test
  needs: []
  script:
    - ./gradlew :app:assembleDebug
  artifacts:
    paths:
      - app/build/outputs/apk/debug/*.apk
    expire_in: 1 week

# Release build feeding distribute-internal (mirrors Stratum's
# assemble-release): signs when keystore secrets are available (main),
# builds unsigned otherwise (MRs run without secrets) — the
# .keystore-signed-flag artifact proves which happened, and
# distribute-internal refuses an unsigned APK.
assemble-release:
  extends: .android-job
  tags: [home-server]
  stage: test
  needs: []
  # Scheduled pipelines must not spend a release build feeding distributions
  # that schedules never trigger (same guard as Stratum).
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'
  script:
    - !reference [.keystore-bootstrap-optional, script]
    - ./gradlew :app:assembleRelease
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
      - .keystore-signed-flag
    expire_in: 1 week

# Firebase App Distribution: merge-to-phone for Sean's dogfooding (ENC-63).
# Auto-runs on every main merge. Uploads the RELEASE-signed APK produced by
# assemble-release — no version bump required, upload as often as needed.
# Targets the "Internal" tester group. Fails loudly rather than distributing
# a debug/unsigned build.
distribute-internal:
  extends: .android-job
  tags: [home-server]
  stage: deploy
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != 'schedule'
  # needs: opts out of stage gating, so list the gate jobs explicitly to
  # prevent distributing an unbuilt/untested change. The signed release APK
  # arrives via the assemble-release artifact — no Gradle rebuild here.
  needs: [assemble-release, unit-tests, static-analysis]
  script:
    - test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "Missing FIREBASE_SERVICE_ACCOUNT_JSON file variable — see header of .gitlab-ci.yml" && exit 1)
    - export GOOGLE_APPLICATION_CREDENTIALS="$FIREBASE_SERVICE_ACCOUNT_JSON"
    # Explicit contract: assemble-release must have produced a SIGNED APK.
    # The .keystore-signed-flag artifact proves secrets were available there.
    - test -f .keystore-signed-flag || (echo "APK was not signed — assemble-release lacked KEYSTORE_BASE64 / STORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD; see header of .gitlab-ci.yml" && exit 1)
    # Explicit contract: assemble-release must have produced exactly one APK.
    - |
      shopt -s nullglob
      APK_FILES=(app/build/outputs/apk/release/*.apk)
      shopt -u nullglob
      if [ ${#APK_FILES[@]} -eq 0 ]; then echo "No APK found" && exit 1; fi
      if [ ${#APK_FILES[@]} -gt 1 ]; then echo "Multiple APKs found: ${APK_FILES[*]}" && exit 1; fi
      # firebase-tools is PINNED: bump the pin deliberately in a commit —
      # never float on latest. The 2026-10 upload 403s were NOT a version
      # problem (ENC-166): the job authenticated as the wrong identity. The
      # service account in GOOGLE_APPLICATION_CREDENTIALS has full upload
      # rights on this app (proven against the raw App Distribution API),
      # but a cached firebase user login in the runner account's
      # configstore can shadow it. HOME is therefore pointed at a fresh
      # temp dir for this call so no cached login exists: the upload
      # authenticates deterministically as the service account.
      HOME="$(mktemp -d)" npx firebase-tools@15.34.0 appdistribution:distribute "${APK_FILES[0]}" \
        --app 1:74044613867:android:37d80fbdff97cd7b0d8aae \
        --groups "Internal" \
        --release-notes "Build ${CI_COMMIT_SHORT_SHA} from main" \
        --non-interactive
  artifacts:
    paths:
      - app/build/outputs/apk/release/*.apk
    expire_in: 1 week
