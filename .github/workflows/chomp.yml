# Chomp Review — automated PR review via the chomp-reviewer reusable workflow (v1.1.6).
# Supply-chain note: both pins below move together, always to a release tag, never
# a branch. Only declared secrets are passed, never `secrets: inherit`.
name: Chomp Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  chomp-review:
    uses: shippopotamuslabs/chomp-reviewer/.github/workflows/forge-review.yml@v1.1.6
    with:
      forge_ref: v1.1.6
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      FORGE_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
