# Chomp Review — automated PR review via the chomp-reviewer reusable workflow (v2.1.0).
# Supply-chain note: both pins below move together, always to a release tag, never
# a branch. Only declared secrets are passed, never `secrets: inherit`.
name: Chomp Review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  chomp-review:
    uses: shippopotamuslabs/chomp-reviewer/.github/workflows/chomp-review.yml@v2.1.0
    with:
      chomp_ref: v2.1.0
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      CHOMP_APP_PRIVATE_KEY: ${{ secrets.FORGE_APP_PRIVATE_KEY }}
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
