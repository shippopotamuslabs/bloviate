# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=768m -XX:+UseG1GC -Dfile.encoding=UTF-8
# Kill after 20 minutes
org.gradle.daemon.idletimeout=1200000
# Force the Kotlin compiler daemon to fallback and run inside the Gradle process
# instead of spawning a brand new multi-gigabyte Java twin
kotlin.daemon.jvm.options=-Xmx2g
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

android.useAndroidX=true

# Enable the cache for faster feedback loops
org.gradle.configuration-cache=true

# Prevent build failures from cache-incompatible plugins
org.gradle.configuration-cache.problems=warn

# Parallel execution
org.gradle.parallel=true

# KSP 2 and Hilt support
ksp.useKSP2=true
hilt.enableAggregatingTask=true

# KSP settings
ksp.incremental=true
ksp.incremental.intermodule=true
